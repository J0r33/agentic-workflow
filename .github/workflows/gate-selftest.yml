name: gate-selftest

# Runs every gate template against fixtures with a known right answer, so each gate is seen
# passing and going red on every change. See tests/gates/run.mjs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Every gate passes the good fixtures and fails the bad ones
        run: node tests/gates/run.mjs
