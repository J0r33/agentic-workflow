name: dependency-audit

on:
  pull_request:
  push:
    branches: [dev, staging, main]
  schedule:
    - cron: "0 9 * * 1" # weekly: new advisories appear without any code change

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # `pnpm audit` exits non-zero both when it finds advisories AND when it cannot reach the
      # registry. We capture its output and exit code, and let audit-gate.mjs tell them apart,
      # instead of forgiving both with `|| true`.
      - name: Run audit
        run: |
          set +e
          pnpm audit --prod --json > audit.json
          code=$?
          set -e
          echo "pnpm audit exited $code; $(wc -c < audit.json) bytes of output"

      - name: Gate
        run: node scripts/audit-gate.mjs audit.json .audit-allowlist.json
